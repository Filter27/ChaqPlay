name: Compilar ChaqPlay para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar motor de YouTube
        shell: powershell
        run: npm run prepare:yt-dlp

      - name: Verificar frontend
        run: npm test

      - name: Crear instaladores
        uses: tauri-apps/tauri-action@v0

      - name: Crear versión portable
        shell: powershell
        run: npm run package:portable

      - name: Guardar versión portable e instaladores
        uses: actions/upload-artifact@v4
        with:
          name: ChaqPlay-Windows-${{ github.ref_name }}
          path: |
            ChaqPlay-Portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
