[package]
name = "chaqplay"
version = "1.0.0"
description = "A minimal portable music player for Windows"
authors = ["Filter27"]
edition = "2021"

[lib]
name = "chaqplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
